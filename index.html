<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Colors</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff7fb;touch-action:manipulation;user-select:none;-webkit-user-select:none}
h1{text-align:center;color:#d6336c;margin:12px}#picker{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px #0002;padding:8px;text-align:center;font-weight:600}.card svg{width:100%;height:auto}
#game{display:none;flex-direction:column;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100vh;height:100dvh;overflow:hidden}#top,#pal{flex:0 0 auto}#top{padding-top:max(8px,env(safe-area-inset-top))}#top{display:flex;align-items:center;gap:8px;padding:8px}
#back{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003;padding:0}button{font-size:18px;border:0;border-radius:12px;padding:8px 12px;background:#ffd6e7}#bar{flex:1;height:12px;background:#eee;border-radius:6px}#fill{height:100%;width:0;background:#51cf66;border-radius:6px}
#wrap{flex:1 1 0;min-height:0;overflow:hidden;position:relative;background:#fff;touch-action:none}#art{position:absolute;left:0;top:0;transform-origin:0 0}
#art path{stroke:#333;stroke-width:.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-width:1.2px}#art{shape-rendering:geometricPrecision}#art text{font-size:7px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#555}
.hint{animation:blink .6s 2}@keyframes blink{50%{fill:#ffe066}}
#pal{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:16px 16px max(16px,env(safe-area-inset-bottom));background:#f2f2f2;box-shadow:0 -1px 0 #0001;gap:14px;-webkit-overflow-scrolling:touch}.sw{flex:0 0 60px;min-width:60px;height:60px;border-radius:50%;border:3px solid transparent;box-shadow:none;font-weight:500;font-size:24px;display:flex;align-items:center;justify-content:center}
.sw{transition:transform .15s,box-shadow .2s}.sw.sel{border-color:transparent;transform:scale(1.12);box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c),0 0 16px 7px var(--c)}.sw.sel.light{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px #666,0 0 16px 7px var(--c),0 0 4px 2px #0003}.spk{position:fixed;width:8px;height:8px;margin:-4px;border-radius:50%;pointer-events:none;z-index:20;animation:spk .55s ease-out forwards}@keyframes spk{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}@media (prefers-reduced-motion:reduce){.sw{transition:none}.spk{display:none}}.sw.done{opacity:.35}
#yay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:#0007;align-items:center;justify-content:center;font-size:40px;color:#fff;text-align:center;z-index:9}
#reset{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003;padding:0;font-size:22px;z-index:2}#art text.sm{display:none}#art.zoomed text.sm{display:inline}.so{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px auto 0;min-height:48px;padding:8px 16px;font-size:17px;font-weight:700;background:#ffd6e7;color:#a61e4d;border:2px solid #d6336c;border-radius:24px}.so .ar{font-size:24px;line-height:1;display:inline-block}.so:active{transform:scale(.96)}.big{min-height:56px;min-width:44px;font-size:22px;font-weight:700;margin:6px;padding:10px 20px;border-radius:28px}#yay .big{font-size:24px;margin-top:14px}#ask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;box-sizing:border-box;background:#0008;align-items:center;justify-content:center;z-index:30;padding:16px}#ask .box{background:#fff;border-radius:24px;padding:20px;max-width:340px;width:100%;text-align:center;color:#333;box-shadow:0 8px 30px #0006}#ask .q{font-size:30px;font-weight:800;color:#d6336c}#ask p{font-size:19px;margin:10px 0 14px}#ask .big{display:block;width:100%;box-sizing:border-box;margin:10px 0}#askyes{background:#ff8fab;color:#fff}#askno{background:#51cf66;color:#fff}@media (prefers-reduced-motion:reduce){.so:active{transform:none}}#pal .sw{margin-right:14px}#pal .sw:last-child{margin-right:0}#top>*{margin-right:8px}.so{margin-left:auto;margin-right:auto}#home,#game,#yay,#ask{-webkit-tap-highlight-color:transparent}.so,.big,#askyes,#askno,#again,#ok{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}#welcome,#home{box-sizing:border-box;min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:max(12px,env(safe-area-inset-bottom));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.hey{font-size:34px;margin:14px 8px 0}.sub{text-align:center;color:#a61e4d;font-size:19px;font-weight:600;margin:4px 8px 6px}
#cats{display:grid;grid-template-columns:repeat(2,1fr);grid-gap:12px;gap:12px;padding:12px}
.tile{position:relative;border:0;border-radius:24px;min-height:128px;padding:12px 8px;color:#fff;text-align:center;font-family:inherit;box-shadow:0 4px 0 #0003;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 #0003}.tile .em{font-size:46px;line-height:1.1}.tile .nm{font-size:19px;font-weight:800;margin-top:4px;text-shadow:0 1px 2px #0004}
.tile .ct{font-size:15px;font-weight:700;margin-top:4px;background:#fff9;color:#333;border-radius:12px;padding:2px 10px}.tile.empty{opacity:.85}
#hhead{display:flex;align-items:center;padding:8px 12px 0}#hback{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003;padding:0;font-size:20px;flex:0 0 48px;cursor:pointer;touch-action:manipulation}#htitle{flex:1;margin:0 48px 0 0;font-size:26px}
.soon{grid-column:1/-1;text-align:center;font-size:24px;font-weight:700;color:#a61e4d;padding:40px 16px;line-height:1.4}.soon span{font-size:64px;display:block}
@media (prefers-reduced-motion:reduce){.tile:active{transform:none}}
</style></head><body>
<div id="welcome"><h1 class="hey">🎨 Hey, welcome!</h1><p class="sub">What do you want to color today?</p><div id="cats"></div></div>
<div id="home"><div id="hhead"><button type="button" id="hback" aria-label="Back">⬅</button><h1 id="htitle"></h1></div><div id="picker"></div></div>
<div id="game"><div id="top"><button id="back">⬅</button><div id="bar"><div id="fill"></div></div><span id="pct">0%</span><button id="zin">＋</button><button id="zout">－</button></div>
<div id="wrap"><svg id="art"></svg><button id="reset" aria-label="Zoom out">⤢</button></div><div id="pal"></div></div>
<div id="ask"><div class="box"><div class="q">Start over?</div><p>This will erase your coloring on <b id="askname"></b>.</p><button id="askyes" class="big yes">Yes, start over</button><button id="askno" class="big no">No, keep it</button></div></div><div id="yay"><div>🎉⭐🎉<br>¡Terminaste!<br>You did it!<br><button id="again" class="big">🎨 Color again</button> <button id="ok" class="big">OK</button></div></div>
<script src="pictures.js?v=8"></script><script src="app.js?v=8"></script></body></html>
