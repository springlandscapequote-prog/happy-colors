<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Happy Colors</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff7fb;touch-action:manipulation;user-select:none;-webkit-user-select:none}
h1{text-align:center;color:#d6336c;margin:12px}#picker{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px #0002;padding:8px;text-align:center;font-weight:600}.card svg{width:100%;height:auto}
#game{display:none;flex-direction:column;position:fixed;inset:0;height:100vh;height:100dvh;overflow:hidden}#top,#pal{flex:0 0 auto}#top{padding-top:max(8px,env(safe-area-inset-top))}#top{display:flex;align-items:center;gap:8px;padding:8px}
#back{width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003;padding:0}button{font-size:18px;border:0;border-radius:12px;padding:8px 12px;background:#ffd6e7}#bar{flex:1;height:12px;background:#eee;border-radius:6px}#fill{height:100%;width:0;background:#51cf66;border-radius:6px}
#wrap{flex:1 1 0;min-height:0;overflow:hidden;position:relative;background:#fff;touch-action:none}#art{position:absolute;left:0;top:0;transform-origin:0 0}
#art path{stroke:#333;stroke-width:.6}#art text{font-size:7px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#555}
.hint{animation:blink .6s 2}@keyframes blink{50%{fill:#ffe066}}
#pal{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:10px 10px max(10px,env(safe-area-inset-bottom));background:#f2f2f2;box-shadow:0 -1px 0 #0001;gap:14px;-webkit-overflow-scrolling:touch}.sw{flex:0 0 60px;min-width:60px;height:60px;border-radius:50%;border:3px solid transparent;box-shadow:none;font-weight:500;font-size:24px;display:flex;align-items:center;justify-content:center}
.sw.sel{border-color:#333;box-shadow:0 0 0 3px #fff inset}.sw.done{opacity:.35}
#yay{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;font-size:40px;color:#fff;text-align:center;z-index:9}
#reset{position:absolute;right:12px;bottom:12px;width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0003;padding:0;font-size:22px;z-index:2}#art text.sm{display:none}#art.zoomed text.sm{display:inline}</style></head><body>
<div id="home"><h1>🎨 Happy Colors</h1><div id="picker"></div></div>
<div id="game"><div id="top"><button id="back">⬅</button><div id="bar"><div id="fill"></div></div><span id="pct">0%</span><button id="zin">＋</button><button id="zout">－</button></div>
<div id="wrap"><svg id="art"></svg><button id="reset" aria-label="Zoom out">⤢</button></div><div id="pal"></div></div>
<div id="yay"><div>🎉⭐🎉<br>¡Terminaste!<br>You did it!<br><button id="ok">OK</button></div></div>
<script src="pictures.js"></script><script src="app.js"></script></body></html>
